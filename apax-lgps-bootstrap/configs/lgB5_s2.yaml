n_epochs: 1000
seed: 2
ckpt_interval: 10
patience: null
callbacks:
- name: csv
progress_bar:
  disable_batch_pbar: true
  disable_epoch_pbar: false
data:
  directory: /home/chronum/scratch/lgps/models
  experiment: lgB5_s2
  train_data_path: /home/chronum/scratch/lgps/data/train.extxyz
  val_data_path: /home/chronum/scratch/lgps/data/val.extxyz
  batch_size: 4
  valid_batch_size: 20
  pos_unit: Ang
  energy_unit: eV
  dataset:
    processing: cached
    shuffle_buffer_size: 1000
  scale_method: per_element_force_rms_scale
  shift_method: per_element_regression_shift
  shift_options:
    energy_regularisation: 1.0
loss:
- name: energy
  loss_type: mse
  weight: 1.0
- name: forces
  loss_type: mse
  weight: 4.0
- name: stress
  loss_type: tril
  weight: 0.2
metrics:
- name: energy
  reductions:
  - mae
- name: forces
  reductions:
  - mae
  - mse
- name: stress
  reductions:
  - mae
model:
  name: gmnn
  basis:
    name: bessel
    n_basis: 12
    r_max: 6.0
  n_radial: 12
  n_radial_tensor: 5
  n_contr: 8
  radial_rank: 8
  radial_emb_jitter: 0.1
  drop_contractions: []
  nn:
  - 128
  - 128
  use_bias: false
  readout_activation: elu
  emb_init: uniform
  radial_transform: identity
  empirical_corrections:
  - name: nlh
    r_max: 6.0
  calc_stress: true
  descriptor_dtype: fp32
  readout_dtype: fp32
  scale_shift_dtype: fp64
  packed_moments: true
optimizer:
  name: muon
  nn_lr: 0.001
  emb_lr: 0.001
  scale_lr: 0.001
  shift_lr: 0.003
  zbl_lr: 0.0001
  kwargs:
    muon_lr: 0.02
    muon_weight_decay: 0.01
  schedule:
    name: cyclic_cosine
    period: 1000
    decay_factor: 0.93
weight_average:
  ema_start: 50
  decay: 0.999
