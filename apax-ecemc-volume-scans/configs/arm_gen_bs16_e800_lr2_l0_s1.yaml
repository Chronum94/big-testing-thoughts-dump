callbacks:
- name: csv
ckpt_interval: 50
data:
  batch_size: 16
  dataset:
    processing: cached
    shuffle_buffer_size: 1000
  directory: /home/chronum/scratch/ecemc/models
  energy_unit: eV
  experiment: arm_gen_bs16_e800_lr2_l0_s1
  pos_unit: Ang
  scale_method: per_element_force_rms_scale
  shift_method: per_element_regression_shift
  shift_options:
    energy_regularisation: 1.0e-05
  train_data_path: /home/chronum/scratch/ecemc/data/gen/train.extxyz
  val_data_path: /home/chronum/scratch/ecemc/data/val.extxyz
  valid_batch_size: 8
loss:
- loss_type: mse
  name: energy
  weight: 1.0
- loss_type: mse
  name: forces
  weight: 4.0
metrics:
- name: energy
  reductions:
  - mae
- name: forces
  reductions:
  - mae
  - mse
model:
  basis:
    n_basis: 12
    name: bessel
    r_max: 5.0
  calc_stress: false
  descriptor_dtype: fp32
  drop_contractions: []
  emb_init: uniform
  empirical_corrections:
  - name: nlh
    r_max: 5.0
  n_contr: 8
  n_radial: 12
  n_radial_tensor: 5
  name: gmnn
  nn:
  - 128
  - 128
  packed_moments: true
  radial_emb_jitter: 0.1
  radial_rank: 8
  radial_transform: identity
  readout_activation: identity
  readout_dtype: fp32
  scale_shift_dtype: fp64
  use_bias: false
  zero_init_output: true
n_epochs: 800
optimizer:
  emb_lr: 0.002
  kwargs:
    muon_lr: 0.04
    muon_weight_decay: 0.01
  name: muon
  nn_lr: 0.002
  scale_lr: 0.002
  schedule:
    decay_factor: 0.93
    name: cyclic_cosine
    period: 800
  shift_lr: 0.006
  zbl_lr: 0.0002
patience: null
progress_bar:
  disable_batch_pbar: true
  disable_epoch_pbar: false
scan_epoch: true
seed: 1
weight_average:
  decay: 0.999
  ema_start: 400
